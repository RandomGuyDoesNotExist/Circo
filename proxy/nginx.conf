upstream frontend_service {
    server frontend:80;
}

upstream auth_service {
    server auth-api:4000;
}

upstream resource_service {
    server resource-api:5000;
}

upstream realtime_service {
    server realtime-service:6000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Client upload limit
    client_max_body_size 60M;

    # Proxy health check endpoint for quick verification
    location /proxy-health {
        access_log off;
        return 200 '{"status":"ok","proxy":"nginx-1.27"}';
        add_header Content-Type application/json;
    }

    # Frontend Flutter Web UI
    location / {
        proxy_pass http://frontend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authentication & Profile API
    location /api/auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Files, Resources & Notes API
    location /api/resources/ {
        proxy_pass http://resource_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime HTTP API & Health
    location /api/realtime/ {
        proxy_pass http://realtime_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime WebSocket / Socket.io Engine
    location /socket.io/ {
        proxy_pass http://realtime_service/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
